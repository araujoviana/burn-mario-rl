[package]
name = "burn-mario-rl"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff", "flex"] }
libloading = "0.9.0"

[features]
flex = ["burn/flex"]
tch = ["burn/tch"]
cuda = ["burn/cuda", "burn/fusion", "burn/autotune"]
wgpu = ["burn/wgpu"]
# 11 actions instead of 7: adds down (pipes), up (vines, doors) and spin jump. Checkpoints are not interchangeable.
extended_actions = []
